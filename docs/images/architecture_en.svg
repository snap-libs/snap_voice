<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrowhead markers (Muted & Monochrome) -->
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#6e7681" />
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8b949e" />
    </marker>
  </defs>

  <!-- 1. Legacy Pipeline Subgraph -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="920" height="170" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <rect x="18" y="14" width="4" height="16" rx="2" fill="#6e7681" />
    <text x="30" y="27" fill="#8b949e" font-size="13" font-weight="600" letter-spacing="0.3">Legacy MeloTTS Pipeline</text>
    
    <!-- Node: Input -->
    <rect x="30" y="55" width="130" height="75" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <text x="95" y="98" fill="#c9d1d9" font-size="13.5" font-weight="500" text-anchor="middle">Input Text</text>

    <!-- Arrow 1 -->
    <line x1="160" y1="92.5" x2="200" y2="92.5" stroke="#6e7681" stroke-width="1.2" marker-end="url(#arrow-muted)" />

    <!-- Node: Preprocessing -->
    <rect x="205" y="55" width="225" height="75" rx="6" fill="#0d1117" stroke="#484f58" stroke-width="1" stroke-dasharray="3,3" />
    <text x="317" y="87" fill="#c9d1d9" font-size="13" font-weight="500" text-anchor="middle">Python Preprocessing (Legacy)</text>
    <text x="317" y="108" fill="#8b949e" font-size="11.5" text-anchor="middle">num2words + g2pkk</text>

    <!-- Arrow 2 -->
    <line x1="430" y1="92.5" x2="470" y2="92.5" stroke="#6e7681" stroke-width="1.2" marker-end="url(#arrow-muted)" />

    <!-- Node: FP32 BERT -->
    <rect x="475" y="55" width="225" height="75" rx="6" fill="#0d1117" stroke="#484f58" stroke-width="1" stroke-dasharray="3,3" />
    <text x="587" y="87" fill="#c9d1d9" font-size="13" font-weight="500" text-anchor="middle">PyTorch FP32 BERT</text>
    <text x="587" y="108" fill="#8b949e" font-size="11.5" text-anchor="middle">Model Loading &amp; Inference (~420MB)</text>

    <!-- Arrow 3 -->
    <line x1="700" y1="92.5" x2="740" y2="92.5" stroke="#6e7681" stroke-width="1.2" marker-end="url(#arrow-muted)" />

    <!-- Node: Acoustic Model -->
    <rect x="745" y="55" width="145" height="75" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <text x="817" y="87" fill="#c9d1d9" font-size="13" font-weight="500" text-anchor="middle">MeloTTS</text>
    <text x="817" y="108" fill="#8b949e" font-size="11.5" text-anchor="middle">Acoustic Model (VITS)</text>
  </g>

  <!-- 2. Integrated Pipeline Subgraph -->
  <g transform="translate(20, 210)">
    <rect x="0" y="0" width="920" height="250" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <rect x="18" y="14" width="4" height="16" rx="2" fill="#58a6ff" />
    <text x="30" y="27" fill="#e6edf3" font-size="13" font-weight="600" letter-spacing="0.3">SNAP + MeloTTS Integrated Pipeline</text>
    
    <!-- Node: Input -->
    <rect x="30" y="90" width="115" height="80" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <text x="87" y="136" fill="#c9d1d9" font-size="13.5" font-weight="500" text-anchor="middle">Input Text</text>

    <!-- Arrow 1 -->
    <line x1="145" y1="130" x2="175" y2="130" stroke="#8b949e" stroke-width="1.3" marker-end="url(#arrow-accent)" />

    <!-- Node: SNAP Engine (Core) -->
    <rect x="180" y="65" width="220" height="130" rx="8" fill="#1b212b" stroke="#388bfd" stroke-width="1.2" />
    <text x="290" y="102" fill="#e6edf3" font-size="14.5" font-weight="600" text-anchor="middle">SNAP C++ Engine</text>
    <text x="290" y="124" fill="#79c0ff" font-size="12.5" font-weight="500" text-anchor="middle">&amp; INT8 ONNX BERT</text>
    <rect x="205" y="145" width="170" height="26" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="0.8" />
    <text x="290" y="162" fill="#8b949e" font-size="11" text-anchor="middle">103.9MB Native Tensor</text>

    <!-- Branch 1: Top (Phonology / Normalized Text) -->
    <path d="M 400 105 C 440 105, 430 75, 475 75" fill="none" stroke="#6e7681" stroke-width="1.3" marker-end="url(#arrow-muted)" />
    <!-- Branch Label 1 -->
    <rect x="420" y="46" width="180" height="20" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="0.8" />
    <text x="510" y="60" fill="#8b949e" font-size="10.5" font-weight="500" text-anchor="middle">① Remove g2pkk / num2words</text>

    <rect x="480" y="70" width="210" height="60" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <text x="585" y="96" fill="#c9d1d9" font-size="13" font-weight="500" text-anchor="middle">Normalized &amp; G2P Text</text>
    <text x="585" y="116" fill="#8b949e" font-size="11" text-anchor="middle">Phonetics + 1:1 Token Alignment</text>

    <path d="M 690 100 C 720 100, 715 125, 740 125" fill="none" stroke="#6e7681" stroke-width="1.3" marker-end="url(#arrow-muted)" />

    <!-- Branch 2: Bottom (BERT Feature Tensor) -->
    <path d="M 400 155 C 440 155, 430 185, 475 185" fill="none" stroke="#6e7681" stroke-width="1.3" marker-end="url(#arrow-muted)" />
    <!-- Branch Label 2 -->
    <rect x="420" y="156" width="200" height="20" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="0.8" />
    <text x="520" y="170" fill="#8b949e" font-size="10.5" font-weight="500" text-anchor="middle">② C-API Precomputed BERT Tensor</text>

    <rect x="480" y="180" width="210" height="60" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <text x="585" y="206" fill="#c9d1d9" font-size="13" font-weight="500" text-anchor="middle">Precomputed BERT Feature</text>
    <text x="585" y="226" fill="#8b949e" font-size="11" text-anchor="middle">768-dim Shared Memory Vector</text>

    <path d="M 690 210 C 720 210, 715 135, 740 135" fill="none" stroke="#6e7681" stroke-width="1.3" marker-end="url(#arrow-muted)" />

    <!-- Target Node: MeloTTS Acoustic Model -->
    <rect x="745" y="90" width="145" height="80" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <text x="817" y="124" fill="#c9d1d9" font-size="13" font-weight="500" text-anchor="middle">MeloTTS</text>
    <text x="817" y="145" fill="#8b949e" font-size="11.5" text-anchor="middle">Acoustic Model (VITS)</text>
  </g>
</svg>
